server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed build output -- a missing one (e.g. a stale
    # cached page requesting a bundle from a prior deploy) should
    # 404 for real, not silently fall back to index.html and mask it.
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes aren't real files -- fall back to index.html
    # so the app's router can handle them. Without this, a direct
    # navigation or refresh on any route but "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
