[pytest]
pythonpath = .
markers =
    integration: tests that require a live Postgres database
    unit: pure-function tests with no database dependency
    live_api: tests that call real external APIs (e.g. Yahoo Finance) -- excluded by default via conftest.py, run with `pytest --run-live-api`
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
