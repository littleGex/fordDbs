server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Fetched by phones without a session, so a missing file must 404
    # rather than fall back to index.html. nginx has no default type for
    # .webmanifest.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location ~ ^/(favicon\.ico|apple-touch-icon\.png|icon-(192|512)\.png)$ {
        try_files $uri =404;
    }

    location / {
        # This line forces Nginx to route everything to Vue Router
        try_files $uri $uri/ /index.html;
    }
}
