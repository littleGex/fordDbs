name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Mapped to host port 5434 (not Postgres's default 5432) to match
    # the TEST_DB_PORT default documented in README.md / tests/conftest.py,
    # so this job needs no extra TEST_* env vars to find it.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: forddbs_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d forddbs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      # minio/minio requires a "server /data" command argument with no
      # built-in default, which the `services:` block above has no way
      # to pass (it only supports docker-run flags via `options`, not a
      # trailing command) -- so it's started as a plain step instead,
      # matching the TEST_MINIO_* defaults in tests/conftest.py / the
      # local dev container documented in README.md.
      - name: Start test MinIO
        run: |
          docker run -d --name test-minio \
            -e MINIO_ROOT_USER=testadmin \
            -e MINIO_ROOT_PASSWORD=testpassword \
            -p 9002:9000 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9002/minio/health/live && break
            sleep 1
          done

      - name: Run test suite
        run: pytest
