server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed build output -- a missing one (e.g. a stale
    # cached page requesting a bundle from a prior deploy) should
    # 404 for real, not silently fall back to index.html and mask it.
    location /assets/ {
        try_files $uri =404;
    }

    # Fetched by phones without a session, so a missing file must 404
    # rather than fall back to index.html. nginx has no default type for
    # .webmanifest.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location ~ ^/(favicon\.ico|apple-touch-icon\.png|icon-(192|512)\.png)$ {
        try_files $uri =404;
    }

    # Client-side routes (e.g. /messages, /home) aren't real files --
    # fall back to index.html so vue-router can handle them. Without
    # this, a direct navigation or refresh on any route but "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
